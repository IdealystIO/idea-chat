[package]
name = "chat-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Idea Chat's shared vocabulary: the domain types, the live reducer both sides run, a channel's message timeline, and message text. Platform-free and pure, so it is the same code in the wasm client, a native client and the server."

[dependencies]
idea-state = { workspace = true }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7"] }
