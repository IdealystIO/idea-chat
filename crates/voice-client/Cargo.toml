[package]
name = "voice-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "idea-chat step-1 voice client — mic capture out, remote PCM in, proving the AudioStream transport seams end to end."

# The app crate IS the artifact: `src/lib.rs` holds the components and
# `src/main.rs` is the one-line entry point. Both targets coexist.
[lib]
crate-type = ["rlib"]

[dependencies]
idealyst = { workspace = true }
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
microphone = { workspace = true }
media-stream = { workspace = true }
voice-dsp = { workspace = true }
# Client-side neural suppression. On web the model is NOT in the wasm binary —
# it is fetched at first join and handed to `Denoiser::with_weights`. See
# `suppress.rs` for what that costs and why it is still worth it.
denoise = { workspace = true }
net = { workspace = true }
# With the codec. 20 ms of mono i16 at 48 kHz is 1952 bytes on the wire and a
# QUIC datagram tops out near 1200, so this is what makes the transport possible
# at all — the ~30x bandwidth saving is the part you would have wanted anyway.
voice-proto = { workspace = true, features = ["codec"] }
serde = { version = "1", features = ["derive"] }

# Web-only playback. This is the escape hatch that stands in for the missing
# `audio-output` SDK: on web the framework already bridges a synthetic
# AudioStream to a real MediaStreamTrack, so all that is left is attaching it
# to an <audio> element. On native there is no equivalent and the module
# returns a typed error naming the gap.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document", "Window", "Element", "Node", "HtmlElement", "console",
    "HtmlAudioElement", "HtmlMediaElement", "MediaStream", "Location", "Performance",
] }

[package.metadata.idealyst.app]
name      = "idea-chat voice"
bundle_id = "dev.ideachat.voice"
version   = "0.1.0"
targets   = ["web"]

[package.metadata.idealyst.app.permissions]
microphone = "idea-chat uses your microphone for voice channels."
