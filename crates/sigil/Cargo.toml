[package]
name = "sigil"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sigil: end-to-end encrypted groups and the services built on them (docs/e2ee-protocol.md)."

# Platform-free. MLS is openmls over its RustCrypto provider; everything else
# is RustCrypto too.
[dependencies]
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = "2.2"
