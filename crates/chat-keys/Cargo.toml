[package]
name = "chat-keys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device keys for Idea Chat calls: each device holds an X25519 key, and a call's room key travels between devices sealed to the recipient, so the server that carries it and the relay that forwards the media can read neither."

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
