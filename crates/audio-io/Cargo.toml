[package]
name = "audio-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real-time audio capture and output, off the main thread, with one API across platforms."

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext", "AudioContextOptions", "AudioContextState",
    "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions",
    "AudioNode", "AudioDestinationNode", "AudioParam",
    "MediaStream", "MediaStreamAudioSourceNode", "MediaStreamAudioDestinationNode",
    "MediaStreamTrack", "MediaTrackSettings", "MediaDevices", "MediaStreamConstraints", "MediaTrackConstraints",
    "Navigator", "Window", "Blob", "BlobPropertyBag", "Url",
    "MessagePort", "MessageEvent", "MessageChannel",
    "ScriptProcessorNode", "AudioProcessingEvent", "AudioBuffer",
    "console",
] }
