[package]
name = "sigil-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Sigil delivery service: follows groups' public state, checks commits against their policy, and stores and routes ciphertext it cannot read."

# Transport-free: sigil-api puts it behind the framework, tests drive it
# directly.
[dependencies]
sigil = { path = "../sigil" }
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_traits = "0.6.0"
ed25519-dalek = "2.2"
