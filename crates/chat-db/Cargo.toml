[package]
name = "chat-db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Idea Chat's data layer: the Postgres schema and every query behind accounts, spaces, channels, messages, people and calls. Server-only; the clients never link it."

[dependencies]
chat-model = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "macros", "migrate",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
