[package]
name = "hearth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hearth — the idea-chat client. A small, quiet place to talk: spaces, rooms that never end, and no firehose."

# The app crate IS the artifact: `src/lib.rs` holds the components and
# `src/main.rs` is the one-line entry point. Both targets coexist, matching
# `voice-client`'s shape so the two apps stay buildable the same way.
[lib]
crate-type = ["rlib"]

[features]
default = []
# The server half: `#[server]` bodies, the database, the session store.
# The wasm client build never turns this on, so none of it reaches the bundle.
server = [
    "server/server", "server-kit/server",
    "dep:hearth-db", "dep:voice-auth", "dep:voice-server", "cache/redis", "dep:redis", "dep:axum", "dep:tokio", "dep:tower-http", "dep:rand", "dep:time",
]

[dependencies]
idealyst = { workspace = true }
server = { workspace = true }
server-kit = { workspace = true }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
# Native session-token storage (Keychain / AndroidKeyStore). On web the
# httpOnly cookie is the mechanism and this goes unused.
credentials = { workspace = true }

# --- server-only ---
hearth-db = { workspace = true, optional = true }
# Mints room tickets the voice relays verify. Server-only: the client is given
# a ticket, it never makes one.
voice-auth = { workspace = true, optional = true }
# The `/_voice` routes, mounted on this origin. Server-only.
voice-server = { path = "../voice-server", optional = true }
cache = { workspace = true, optional = true }
# The Redis client is the app's to provide: `cache` and `server_kit`'s rate
# limiter both read the one installed here, so they share a connection pool.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
rand = { version = "0.8", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
# The responsive shell: one sidebar that is pinned on desktop and a drawer
# below it, built once. See `client::Shell`.
idea-ui-nav = { workspace = true }
# The client/server reducer this app is prototyping — see `src/live.rs`.
idea-state = { workspace = true }
# Names where noise suppression runs. Both halves of the app need the same
# word for it, and this crate is that word.
voice-dsp = { workspace = true }
icons-lucide = { workspace = true }

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]


[package.metadata.idealyst.app]
name      = "Hearth"
bundle_id = "dev.ideachat.hearth"
version   = "0.1.0"
targets   = ["web"]
# Run THIS crate's `server` bin for `idealyst dev --web`, so the API and the
# bundle come from one origin and the session cookie actually applies.
server_bin = "server"

[package.metadata.idealyst.app.permissions]
microphone = "Hearth uses your microphone in voice rooms."
camera     = "Hearth uses your camera when you turn it on in a room."

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `uuid` refuses to build for wasm32 without a randomness source. The client
# needs v7 ids of its own — it mints a message's id before sending, which is
# what makes a retry idempotent — so this is a real dependency, not a
# workaround for one that leaked in from the server half.
uuid = { version = "1", features = ["v7", "serde", "js"] }
# Voice, on the one target that can carry it. `voice-client` owns the audio
# path — capture out, remote PCM in, playback — and Hearth drives it rather
# than reimplementing it. Web-only because playback on native is the missing
# `audio-output` SDK (docs/framework-gap-analysis.md §9); the UI degrades to
# saying so rather than pretending to connect.
voice-client = { path = "../voice-client" }
# Timers. The runtime driver can spawn a future but has nothing that waits, and
# presence needs a heartbeat — see `voice::HEARTBEAT_MS`.
gloo-timers = { version = "0.3", features = ["futures"] }
# For the voice stats seam in `voice.rs` — see `install_stats_probe`.
wasm-bindgen = "0.2"
# The suppression benchmark on that same seam returns a Promise: the model has
# to be fetched before it can be timed.
wasm-bindgen-futures = "0.4"
# The page origin, so server-fn calls are same-origin and the browser attaches
# the session cookie; and a clock for optimistic timestamps.
web-sys = { version = "0.3", features = [
    "Window", "Location",
    # Placeholder notification tones, synthesised — see `src/sound.rs`.
    "AudioContext", "BaseAudioContext", "AudioDestinationNode", "AudioNode",
    "AudioParam", "GainNode", "OscillatorNode", "OscillatorType",
    # Per-device preferences — see `src/prefs.rs`.
    "Storage",
    # Where a silently-degraded setting says so — see `voice::note`.
    "console",
] }
js-sys = "0.3"
