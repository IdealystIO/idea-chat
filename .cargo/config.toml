[registries.idealyst]
index = "sparse+https://crates.idealyst.io/index/"

# WebTransport, for the wasm build only.
#
# `web-sys` gates its WebTransport bindings behind `--cfg=web_sys_unstable_apis`
# and a dependency cannot turn that on for you — `web-transport-wasm` fails with
# a `compile_error!` saying so. See docs/quic-migration.md.
#
# Scoped to the wasm target rather than `[build]` on purpose. The flag is only
# meaningful where `web-sys` is compiled, and a workspace-wide `rustflags`
# changes the fingerprint of every host unit too — one `cargo test` would
# rebuild the world.
#
# This file does NOT reach `idealyst build --web` (CLI 1.5.2). The web builder
# sets `CARGO_ENCODED_RUSTFLAGS` (for `+simd128` and its link args), which makes
# cargo skip this lookup entirely. It does fold in `RUSTFLAGS`, so every script
# that runs the web build passes the flag that way too — tools/check-all.sh and
# deploy/ship.sh. Running it by hand:
#
#   RUSTFLAGS=--cfg=web_sys_unstable_apis idealyst build --web
#
# This section still serves plain `cargo check/build --target wasm32-...`.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis"]
