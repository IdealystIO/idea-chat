# WebTransport, for the wasm build only.
#
# `web-sys` gates its WebTransport bindings behind `--cfg=web_sys_unstable_apis`
# and a dependency cannot turn that on for you — `web-transport-wasm` fails with
# a `compile_error!` saying so. See docs/quic-migration.md.
#
# Scoped to the wasm target rather than `[build]` on purpose. The flag is only
# meaningful where `web-sys` is compiled, and a workspace-wide `rustflags`
# changes the fingerprint of every host unit too — one `cargo test` would
# rebuild the world.
#
# Note this file reaches `idealyst build --web` only from CLI 1.3.16 onward.
# Before that the web builder set `CARGO_ENCODED_RUSTFLAGS`, which makes cargo
# skip its config lookup entirely, and the flag was silently dropped.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis"]
